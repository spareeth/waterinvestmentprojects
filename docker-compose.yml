# Local development services. Dummy data only; never load real country data here.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_local_dev
      POSTGRES_DB: summit_portal
    ports:
      # Bound to localhost only.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d summit_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local test mail server: catches every email the portal sends (nothing leaves this machine).
  # Inbox: http://localhost:8025. Portal settings: MAIL_DRIVER=smtp, SMTP_HOST=localhost, SMTP_PORT=1025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
