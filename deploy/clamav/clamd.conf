# clamd settings for the portal's virus scanner (M8). Mounted over the image's /etc/clamav/clamd.conf.
# The first four lines are the clamav/clamav image defaults (its health check uses the local socket).
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Teasers are at most 25 MB each (the default stream limit is exactly 25 MB). Leave room.
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 256M

# Load new signatures without holding two copies in memory (saves about 1 GB while updating).
ConcurrentDatabaseReload no
